[project]
name = "landeval"
version = "0.1.0"
description = "Building blocks for regional screening in property search: mesh, hazard overlays, routing and travel-time measurement"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "httpx>=0.27",
    "folium>=0.17",
    "pillow>=10.4",
    "numpy>=2.0",
    "jpholiday>=0.1.10",
    "osmium>=4.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landeval"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ARG", "PTH", "S"]
# RUF001-003 flag full-width punctuation and en dashes as "ambiguous". The
# user-facing strings in this project are Japanese, where those characters are
# correct, so the rules only produce false positives here.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the point of a test.
# ARG001: a test double must match the callee's signature even when it ignores an argument.
"tests/*" = ["S101", "ARG001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "folium.*", "jpholiday.*", "pyproj.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=landeval --cov-report=term-missing"
