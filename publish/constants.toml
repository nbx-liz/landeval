# Inventory of every constant and default value in the public landeval modules
# `tests/test_constants_inventory.py` compares the keys with
# what it finds in src/landeval in both directions.
#
# class = "general": a unit, a standard, an API value, a vocabulary or a method
# choice. A value set from the caller's own measurements or judgement is class
# "personal" and does not belong on the public side: the test refuses it.

